# base image: https://hub.docker.com/_/node

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:$PWD
    workdir: $PWD/src
    ports:
      - "8080:8080"
      - "3000:3000"
    # 対話的コンテナのための設定
    tty: true
    stdin_open: true

  deploy:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    volumes:
      - .:$PWD
    workdir: $PWD/scripts/deploy
    # 対話的コンテナのための設定
    tty: true
    stdin_open: true
    profiles: ["deploy"]
    # クレデンシャルの環境変数による引き渡し設定
    env_file:
      - .env
    environment:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
    # セキュリティ強化のための制限
    security_opt:
      - no-new-privileges:true
    cap_drop: 
      - ALL
    read_only: true
    tmpfs:
      - /tmp
